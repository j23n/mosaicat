# Build atmo binaries on native runners and attach them to a GitHub Release.
# Triggers on version tags (v0.1.0). Native OS matrix (not Bun --target
# cross-compile) while CI pins Bun canary — canary cross-compile target
# downloads are often missing. See ADR 004 and scripts/pack.sh.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: atmo-linux-x64
          - os: ubuntu-24.04-arm
            artifact: atmo-linux-arm64
          - os: macos-13
            artifact: atmo-darwin-x64
          - os: macos-latest
            artifact: atmo-darwin-arm64
          - os: windows-latest
            artifact: atmo-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --asset (directory embed into --compile) needs Bun ≥ 1.4; pin canary
      # until that lands in a stable release (ADR 004).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - run: npm ci

      - name: Pack
        shell: bash
        run: npm run pack -- --outfile "dist-bin/${{ matrix.artifact }}"

      - name: Smoke --help / --version
        shell: bash
        run: |
          bin="dist-bin/${{ matrix.artifact }}"
          "$bin" --version
          "$bin" --help | head -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
